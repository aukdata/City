# road.toml - 道路外観スタイル定義
# 実際の車線数は道路オブジェクト (RoadEdge.lanes) が保持する。
# ここでは「道路種別ごとのビジュアルスタイル」のみを定義する。
#
# surface_texture: テクスチャ画像のパス (App/ からの相対パス)。空文字はフォールバック色を使用。
# surface_color:   路面色 [R, G, B] (sRGB 0-1)。テクスチャのティント色にもなる。
# surface_tile_v:  走行方向の UV タイリング [1/m]。大きいほどテクスチャが細かくタイル。
# default_lane_width: 標準車線幅 [m]（新規道路追加時のデフォルト）
# shoulder_width:  路肩幅 [m]（片側）
# median_width:    中央分離帯幅 [m]（0 = なし）
#
# [Section.lane_marking]  同方向車線間の区画線
# [Section.center_line]   対向車線境界のセンターライン
#   color:       線色 [R, G, B]
#   line_width:  線幅 [m]
#   dash_length: 破線の実部長 [m]（0 以下 = 実線）
#   gap_length:  破線の間隔長 [m]

# ─────────────────────────────────────────────────────────────────────
# 一般道（市道・町道）
# ─────────────────────────────────────────────────────────────────────
[LocalRoad]
surface_texture    = "assets/textures/asphalt.png"
surface_color      = [0.36, 0.36, 0.36]
surface_tile_v     = 0.05
default_lane_width = 3.5
shoulder_width     = 0.5
median_width       = 0.0

[LocalRoad.lane_marking]
color       = [1.0, 1.0, 1.0]
line_width  = 0.15
dash_length = 8.0
gap_length  = 12.0

[LocalRoad.center_line]
color       = [1.0, 1.0, 0.0]
line_width  = 0.20
dash_length = 0.0
gap_length  = 0.0

# ─────────────────────────────────────────────────────────────────────
# 幹線道路（国道・県道）
# ─────────────────────────────────────────────────────────────────────
[Arterial]
surface_texture    = "assets/textures/asphalt.png"
surface_color      = [0.30, 0.30, 0.30]
surface_tile_v     = 0.04
default_lane_width = 3.5
shoulder_width     = 0.75
median_width       = 0.0

[Arterial.lane_marking]
color       = [1.0, 1.0, 1.0]
line_width  = 0.15
dash_length = 8.0
gap_length  = 12.0

[Arterial.center_line]
color       = [1.0, 1.0, 0.0]
line_width  = 0.20
dash_length = 0.0
gap_length  = 0.0

# ─────────────────────────────────────────────────────────────────────
# 高速道路（自動車専用道）
# ─────────────────────────────────────────────────────────────────────
[Expressway]
surface_texture    = "assets/textures/asphalt.png"
surface_color      = [0.25, 0.25, 0.25]
surface_tile_v     = 0.03
default_lane_width = 3.75
shoulder_width     = 1.5
median_width       = 3.0

[Expressway.lane_marking]
color       = [1.0, 1.0, 1.0]
line_width  = 0.15
dash_length = 10.0
gap_length  = 10.0

[Expressway.center_line]
color       = [1.0, 1.0, 1.0]
line_width  = 0.20
dash_length = 0.0
gap_length  = 0.0

# ─────────────────────────────────────────────────────────────────────
# 有料道路
# ─────────────────────────────────────────────────────────────────────
[Highway]
surface_texture    = "assets/textures/asphalt.png"
surface_color      = [0.23, 0.23, 0.23]
surface_tile_v     = 0.03
default_lane_width = 3.75
shoulder_width     = 1.5
median_width       = 5.0

[Highway.lane_marking]
color       = [1.0, 1.0, 1.0]
line_width  = 0.15
dash_length = 10.0
gap_length  = 10.0

[Highway.center_line]
color       = [1.0, 1.0, 1.0]
line_width  = 0.20
dash_length = 0.0
gap_length  = 0.0
