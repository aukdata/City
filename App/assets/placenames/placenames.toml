# 地名生成用語根辞書（11_placename_spec.md §2）
# 前節(prefix) と 後節(suffix) を組み合わせて地名を生成する
# 実在する道路標識表示地名（国土交通省資料）をもとに語根を抽出

[River]
# 川・水系・湿地帯に多い地名語根
prefix = [
    "瀬", "渡", "沢", "湊", "津", "江", "川", "水", "浜",
    "滝", "泉", "渕", "浦", "磯", "海", "洗", "波", "網",
    "烏", "鮎", "蟹", "鵜", "湖", "淵", "流", "汐", "潮"
]
suffix = [
    "川", "瀬", "田", "渕", "浜", "江", "津", "沢",
    "橋", "池", "沼", "湊", "淵", "洗", "水"
]

[Mountain]
# 山・丘・高地に多い地名語根
prefix = [
    "高", "岩", "根", "尾", "峰", "古", "御", "黒", "白",
    "赤", "金", "石", "奥", "青", "鷹", "鶴", "鳥", "狩",
    "熊", "鹿", "猿", "兎", "雉", "矢", "剣", "鬼", "竜"
]
suffix = [
    "山", "丘", "台", "坂", "谷", "森", "峠", "野",
    "根", "岳", "嶺", "岡", "岩", "林", "尾"
]

[Plain]
# 平野・田・原に多い地名語根
prefix = [
    "広", "大", "長", "新", "細", "小", "上", "下", "中",
    "東", "西", "南", "北", "春", "木", "杉", "松", "竹",
    "萩", "柳", "楠", "桑", "栗", "梅", "椿", "葦", "菅"
]
suffix = [
    "野", "田", "原", "平", "畑", "里", "村",
    "沢", "草", "林", "丘", "地", "坪", "場"
]

[Coast]
# 海・湾・浜に多い地名語根
prefix = [
    "磯", "鳴", "白", "浦", "崎", "角", "荒", "岩", "黒",
    "赤", "大", "小", "三", "千", "新", "長", "松", "富",
    "日", "月", "潮", "波", "洲", "砂", "塩", "海"
]
suffix = [
    "浜", "港", "崎", "磯", "湾", "津", "島",
    "岬", "浦", "洲", "沖", "瀬"
]

[General]
# 地形に依らない汎用語根（神社・城・街道に多い）
prefix = [
    "飯", "松", "梅", "桜", "鈴", "亀", "甲", "竹", "千",
    "三", "神", "金", "玉", "宮", "藤", "菊", "橘", "春",
    "秋", "福", "栄", "吉", "豊", "市", "橋", "弥", "常"
]
suffix = [
    "本", "中", "東", "西", "南", "北",
    "宮", "神", "城", "寺", "台", "坂", "道", "丘", "郷"
]
